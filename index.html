<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RÊ — BI Cognitivo Renault</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0F0F0F; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* LOGIN */
#login-screen { position: fixed; inset: 0; background: #0F0F0F; display: flex; align-items: center; justify-content: center; z-index: 100; }
.login-box { background: #fff; border-radius: 16px; padding: 44px 40px; width: 390px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.login-logo { text-align: center; margin-bottom: 24px; }
.login-logo .re-name { font-size: 32px; font-weight: 900; color: #1A1A1A; letter-spacing: -1px; }
.login-logo .re-sub  { font-size: 12px; color: #6B7280; margin-top: 2px; }
.login-box label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
.login-box input { width: 100%; padding: 10px 14px; border: 1.5px solid #E5E7EB; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 14px; font-family: inherit; transition: border-color .2s; }
.login-box input:focus { border-color: #FFCC00; }
#login-btn { width: 100%; padding: 12px; background: #FFCC00; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; color: #1A1A1A; }
#login-btn:hover { opacity: .85; }
#login-error { color: #DC2626; font-size: 13px; text-align: center; margin-bottom: 12px; display: none; }

/* APP */
#app { display: none; height: 100vh; flex-direction: column; }

/* HEADER */
#header { background: #fff; border-bottom: 1px solid #E5E7EB; padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.re-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#FFCC00,#FFB300); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; color: #1A1A1A; flex-shrink: 0; }
.h-title { font-weight: 700; font-size: 15px; color: #1A1A1A; }
.h-sub   { font-size: 12px; color: #6B7280; }
#header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; }
#user-label { font-size: 12px; color: #6B7280; }
#logout-btn { background: none; border: 1px solid #E5E7EB; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #6B7280; cursor: pointer; }
#logout-btn:hover { border-color: #EF4444; color: #EF4444; }

/* MESSAGES */
#messages { flex: 1; overflow-y: auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; background: #F3F4F6; }
#welcome { margin: auto; text-align: center; max-width: 500px; }
#welcome .w-av { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg,#FFCC00,#FFB300); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: #1A1A1A; margin: 0 auto 14px; }
#welcome h2 { font-size: 22px; font-weight: 800; color: #1A1A1A; }
#welcome p  { font-size: 14px; color: #6B7280; margin-top: 8px; line-height: 1.6; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
.sug-btn { padding: 8px 14px; background: #fff; border: 1.5px solid #E5E7EB; border-radius: 20px; font-size: 13px; cursor: pointer; color: #374151; font-family: inherit; }
.sug-btn:hover { border-color: #FFCC00; background: #FFFBEB; }

/* BUBBLES */
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.bav { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
.bav.re  { background: linear-gradient(135deg,#FFCC00,#FFB300); color: #1A1A1A; }
.bav.usr { background: linear-gradient(135deg,#2563EB,#1D4ED8); color: #fff; }
.bubble { max-width: 72%; padding: 12px 16px; font-size: 14px; line-height: 1.65; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.bubble.re  { background: #fff; border-radius: 4px 18px 18px 18px; color: #1A1A1A; }
.bubble.usr { background: #1A1A1A; border-radius: 18px 4px 18px 18px; color: #fff; }
.bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.bubble th { background: #1A1A1A; color: #FFCC00; padding: 7px 12px; text-align: left; border-bottom: 2px solid #FFCC00; white-space: nowrap; }
.bubble td { padding: 6px 12px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
.bubble tr:nth-child(even) td { background: #f9f9f9; }
.bubble strong { font-weight: 700; }
.bubble-actions { display: flex; gap: 6px; margin-top: 5px; }
.act-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: #9CA3AF; padding: 2px 5px; border-radius: 4px; }
.act-btn:hover { color: #374151; }
.act-btn.up.active { color: #22C55E; }
.act-btn.down.active { color: #EF4444; }

/* TYPING */
.typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: #FFCC00; display: inline-block; animation: bounce 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100%{transform:scale(.7);opacity:.5} 40%{transform:scale(1.2);opacity:1} }

/* INPUT BAR */
#input-bar { background: #fff; border-top: 1px solid #E5E7EB; padding: 14px 24px; flex-shrink: 0; }
.input-wrap { display: flex; gap: 10px; align-items: flex-end; max-width: 860px; margin: 0 auto; }
#user-input { flex: 1; padding: 11px 16px; border: 1.5px solid #E5E7EB; border-radius: 12px; font-size: 14px; resize: none; outline: none; font-family: inherit; line-height: 1.5; max-height: 120px; overflow-y: auto; transition: border-color .2s; }
#user-input:focus { border-color: #FFCC00; }
#send-btn { padding: 11px 20px; background: #FFCC00; border: none; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; color: #1A1A1A; white-space: nowrap; }
#send-btn:disabled { background: #E5E7EB; cursor: default; }
.input-hint { text-align: center; margin-top: 7px; font-size: 11px; color: #9CA3AF; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="re-name">RÊ</div>
      <div class="re-sub">BI Cognitivo · Rede Renault Brasil</div>
    </div>
    <label>API Key Anthropic</label>
    <input id="login-apikey" type="password" placeholder="sk-ant-...">
    <label>E-mail</label>
    <input id="login-email" type="email" placeholder="seu@email.com.br">
    <label>Senha</label>
    <input id="login-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
    <div id="login-error"></div>
    <button id="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="header">
    <div class="re-avatar">RÊ</div>
    <div>
      <div class="h-title">RÊ — Renault Rede Insights</div>
      <div class="h-sub" id="bases-status">BI Cognitivo · Bases: Jan/2025 – Mar/2026</div>
    </div>
    <div id="header-right">
      <div class="status-dot"></div>
      <span id="user-label"></span>
      <button id="logout-btn" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div id="messages">
    <div id="welcome">
      <div class="w-av">RÊ</div>
      <h2 id="welcome-name">Olá!</h2>
      <p>Eu sou a RÊ, seu assistente de BI Cognitivo especializado em insights da Rede Renault.<br>Como posso te ajudar hoje?</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="setSug(this)">Qual modelo mais emplacou em 2025?</button>
        <button class="sug-btn" onclick="setSug(this)">PDS do Duster por estado</button>
        <button class="sug-btn" onclick="setSug(this)">Top 10 grupos em Curitiba — Dez/2025</button>
        <button class="sug-btn" onclick="setSug(this)">Concorrentes do Kardian</button>
        <button class="sug-btn" onclick="setSug(this)">PDM Kwid vs mercado total em 2025</button>
      </div>
    </div>
  </div>

  <div id="input-bar">
    <div class="input-wrap">
      <textarea id="user-input" rows="1"
        placeholder="Pergunte sobre emplacamentos, PDS, PDM, rankings, concorrentes..."
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Enviar →</button>
    </div>
    <div class="input-hint">Enter para enviar · Shift+Enter para nova linha</div>
  </div>
</div>

<script>
const WORKER = "https://re-nault.fcferreira.workers.dev";

const USERS = [
  { email: "consultor@renault.com.br", senha: "renault123", nome: "Ana Souza",      perfil: "Consultor Renault" },
  { email: "gerente@barigui.com.br",   senha: "barigui123", nome: "Carlos Menezes", perfil: "Gerente de Concessionária" },
];

let API_KEY = "", currentUser = null, history = [], isLoading = false;

// ── AUTH ──────────────────────────────────────────────────
function doLogin() {
  const apikey = document.getElementById("login-apikey").value.trim();
  const email  = document.getElementById("login-email").value.trim();
  const senha  = document.getElementById("login-senha").value;
  const errEl  = document.getElementById("login-error");
  const user   = USERS.find(u => u.email === email && u.senha === senha);

  if (!user) { errEl.textContent = "E-mail ou senha inválidos."; errEl.style.display = "block"; return; }
  if (!apikey.startsWith("sk-ant-")) { errEl.textContent = "API Key inválida. Deve começar com sk-ant-"; errEl.style.display = "block"; return; }

  errEl.style.display = "none";
  API_KEY = apikey; currentUser = user;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("user-label").textContent = `${user.nome} · ${user.perfil}`;
  document.getElementById("welcome-name").textContent = `Olá, ${user.nome.split(" ")[0]}!`;
  document.getElementById("user-input").focus();
}

function doLogout() {
  currentUser = null; history = []; API_KEY = "";
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  ["login-apikey","login-email","login-senha"].forEach(id => document.getElementById(id).value = "");
  resetMessages();
}

// ── CHAT ──────────────────────────────────────────────────
async function sendMessage() {
  const inp  = document.getElementById("user-input");
  const text = inp.value.trim();
  if (!text || isLoading) return;
  inp.value = ""; autoResize(inp);
  isLoading = true;
  document.getElementById("send-btn").disabled = true;

  appendBubble("user", text.replace(/\n/g, "<br>"));
  history.push({ role: "user", content: text });
  showTyping();

  try {
    const res  = await fetch(`${WORKER}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
      body: JSON.stringify({ messages: history })
    });
    const data  = await res.json();
    const reply = data?.content?.[0]?.text || "Não foi possível obter uma resposta.";
    history.push({ role: "assistant", content: reply });
    removeTyping();
    appendBubble("assistant", mdToHtml(reply));
  } catch {
    removeTyping();
    appendBubble("assistant", "⚠️ Erro ao conectar com o Worker. Verifique a conexão.");
  }

  isLoading = false;
  document.getElementById("send-btn").disabled = false;
  document.getElementById("user-input").focus();
}

// ── UI ────────────────────────────────────────────────────
function resetMessages() {
  document.getElementById("messages").innerHTML = `
    <div id="welcome">
      <div class="w-av">RÊ</div>
      <h2 id="welcome-name">Olá!</h2>
      <p>Eu sou a RÊ, seu assistente de BI Cognitivo especializado em insights da Rede Renault.<br>Como posso te ajudar hoje?</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="setSug(this)">Qual modelo mais emplacou em 2025?</button>
        <button class="sug-btn" onclick="setSug(this)">PDS do Duster por estado</button>
        <button class="sug-btn" onclick="setSug(this)">Top 10 grupos em Curitiba — Dez/2025</button>
        <button class="sug-btn" onclick="setSug(this)">Concorrentes do Kardian</button>
      </div>
    </div>`;
}

function hideWelcome() { const w = document.getElementById("welcome"); if (w) w.remove(); }

function appendBubble(role, html) {
  hideWelcome();
  const msgs = document.getElementById("messages");
  const ini  = role === "assistant" ? "RÊ" : (currentUser?.nome?.[0] || "U");
  const row  = document.createElement("div");
  row.className = `msg-row ${role === "user" ? "user" : ""}`;
  row.innerHTML = `
    <div class="bav ${role === "assistant" ? "re" : "usr"}">${ini}</div>
    <div>
      <div class="bubble ${role === "assistant" ? "re" : "usr"}">${html}</div>
      ${role === "assistant" ? `<div class="bubble-actions">
        <button class="act-btn" onclick="copyMsg(this)">⎘</button>
        <button class="act-btn up"   onclick="fbk(this,'up')">👍</button>
        <button class="act-btn down" onclick="fbk(this,'down')">👎</button>
      </div>` : ""}
    </div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  hideWelcome();
  const msgs = document.getElementById("messages");
  const row  = document.createElement("div");
  row.className = "msg-row"; row.id = "typing-row";
  row.innerHTML = `<div class="bav re">RÊ</div><div class="bubble re"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping() { const t = document.getElementById("typing-row"); if (t) t.remove(); }

function mdToHtml(text) {
  const lines = text.split("\n"); let out = "", inTable = false, tHtml = "";
  const p = s => s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
  const flushT = () => { out += tHtml + "</tbody></table></div>"; tHtml = ""; inTable = false; };
  for (const line of lines) {
    if (line.trim().startsWith("|")) {
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!inTable) { inTable = true; tHtml = '<div style="overflow-x:auto"><table><thead><tr>' + cells.map(c=>`<th>${p(c)}</th>`).join("") + "</tr></thead><tbody>"; }
      else if (/^[\s|:-]+$/.test(line)) { /* separador */ }
      else tHtml += "<tr>" + cells.map(c=>`<td>${p(c)}</td>`).join("") + "</tr>";
      continue;
    }
    if (inTable) flushT();
    if (!line.trim()) { out += "<br>"; continue; }
    if (line.startsWith("### ")) { out += `<h3 style="font-size:14px;font-weight:700;margin:10px 0 4px">${p(line.slice(4))}</h3>`; continue; }
    if (line.startsWith("- ") || line.startsWith("• ")) { out += `<div style="display:flex;gap:8px;margin:3px 0"><span style="color:#FFCC00;font-weight:700">•</span><span>${p(line.slice(2))}</span></div>`; continue; }
    out += `<p style="margin:3px 0;line-height:1.65">${p(line)}</p>`;
  }
  if (inTable) flushT();
  return out;
}

function handleKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 120) + "px"; }
function setSug(btn) { document.getElementById("user-input").value = btn.textContent; document.getElementById("user-input").focus(); }
function copyMsg(btn) { const b = btn.closest(".msg-row").querySelector(".bubble"); navigator.clipboard?.writeText(b.innerText); btn.textContent = "✓"; setTimeout(() => btn.textContent = "⎘", 1500); }
function fbk(btn) { btn.closest(".bubble-actions").querySelectorAll(".up,.down").forEach(b => b.classList.remove("active")); btn.classList.add("active"); }
</script>
</body>
</html>
